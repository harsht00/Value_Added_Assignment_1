<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <!-- Helps the webpage adjust to different screen sizes -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DSA Tracker</title>

    <!-- Connects the CSS file to style the webpage -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar: Displays the website logo, menu links and Get Started button -->
    <header class="navbar">

        <!-- Shows the website logo along with its name -->
        <div class="logo">
            <img src="../../../Task 1/Assets/04.png" alt="DSA Tracker Logo">
            <h2>DSA Tracker</h2>
        </div>

        <!-- Provides links to different sections of the website -->
        <nav>
            <ul>
                <li><a href="#" class="active">Home</a></li>
                <li><a href="#">Problems</a></li>
                <li><a href="#">Leaderboard</a></li>
                <li><a href="#">About</a></li>
            </ul>
        </nav>

        <!-- Allows users to start using the website -->
        <a href="#" class="get-started">Get Started</a>

    </header>


    <!-- Hero Section: Introduces DSA Tracker with a heading, description and illustration -->
    <section class="hero">

        <!-- Left side displays the main introduction and action buttons -->
        <div class="hero-content">

            <h1>
                Practice DSA<br>
                Track Progress<br>
                Become <span>Job Ready</span>
            </h1>

            <p>
                Solve daily coding problems, track your progress,
                and build a strong DSA foundation.
            </p>

            <!-- Provides two buttons for accessing the main website actions -->
            <div class="hero-buttons">

                <a href="#" class="primary-btn">
                    Start Practicing <span>→</span>
                </a>

                <a href="#" class="secondary-btn">
                    View Problems
                </a>

            </div>

        </div>

        <!-- Right side displays an illustration of a student practicing coding -->
        <div class="hero-image">
            <img src="../../../Task 1/Assets/05.png" alt="Student practicing coding">
        </div>

    </section>
