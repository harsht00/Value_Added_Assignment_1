<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Portal Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Main container: holds the sidebar on the left and the dashboard on the right -->
    <div class="container">

    <!-- Sidebar: the dark purple panel with the portal logo and menu links -->
    <aside class="sidebar">

        <!-- Logo: graduation cap image with the portal name next to it -->
        <div class="portal-logo">
            <img src="../../../Task 2/Assets/17.png" alt="Student Portal Logo">
            <h2>Student<br>Portal</h2>
        </div>

        <!-- Navigation menu: links to the different sections of the portal -->
        <nav class="sidebar-menu">

            <!-- "active" class highlights the page we are currently on -->
            <a href="#" class="menu-item active">
                <img src="../../../Task 2/Assets/13.png" alt="Dashboard">
                <span>Dashboard</span>
            </a>

            <a href="#" class="menu-item">
                <img src="../../../Task 2/Assets/12.png" alt="Assignments">
                <span>Assignments</span>
            </a>

            <a href="#" class="menu-item">
                <img src="../../../Task 2/Assets/11.png" alt="Courses">
                <span>Courses</span>
            </a>

            <a href="#" class="menu-item">
                <img src="../../../Task 2/Assets/10.png" alt="Progress">
                <span>Progress</span>
            </a>

            <a href="#" class="menu-item">
                <img src="../../../Task 2/Assets/09.png" alt="Profile">
                <span>Profile</span>
            </a>

            <!-- A thin line to separate Logout from the other links -->
            <div class="menu-divider"></div>

            <a href="#" class="menu-item">
                <img src="../../../Task 2/Assets/08.png" alt="Logout">
                <span>Logout</span>
            </a>

        </nav>

    </aside>

</div>

</body>
</html>
